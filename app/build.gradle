plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mohamed.videodownloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mohamed.videodownloader'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.14"
        pip {
            install "yt-dlp==2026.8.19"
        }
    }
}

dependencies {
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-full:8.1.7'
}
